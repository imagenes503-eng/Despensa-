<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Mi Generador IA V2</title>


  <style>

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      background: #0b0d12;

      color: white;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

    }


    header {

      padding: 20px;

      border-bottom:
        1px solid #252936;

      display: flex;

      justify-content:
        space-between;

      align-items:
        center;

    }


    .logo {

      font-size: 22px;

      font-weight: bold;

    }


    .version {

      padding: 6px 10px;

      border:
        1px solid #343947;

      border-radius: 20px;

      color: #aeb6c7;

      font-size: 12px;

    }


    main {

      width: 100%;

      max-width: 1100px;

      margin: auto;

      padding: 24px;

      display: grid;

      grid-template-columns:
        380px 1fr;

      gap: 20px;

    }


    .card {

      background: #12151d;

      border:
        1px solid #252936;

      border-radius: 18px;

      padding: 20px;

    }


    h2 {

      margin-top: 0;

    }


    label {

      display: block;

      margin-top: 15px;

      margin-bottom: 7px;

      color: #b9c0cf;

      font-size: 14px;

    }


    textarea,
    select {

      width: 100%;

      background: #0b0d12;

      color: white;

      border:
        1px solid #303544;

      border-radius: 10px;

      padding: 12px;

      font-size: 14px;

    }


    textarea {

      min-height: 140px;

      resize: vertical;

    }


    .row {

      display: grid;

      grid-template-columns:
        1fr 1fr;

      gap: 10px;

    }


    button {

      width: 100%;

      padding: 14px;

      margin-top: 18px;

      border: 0;

      border-radius: 10px;

      background: white;

      color: #080a0e;

      font-size: 15px;

      font-weight: bold;

      cursor: pointer;

    }


    button:disabled {

      opacity: .5;

      cursor: wait;

    }


    .secondary {

      background: #242936;

      color: white;

    }


    .status {

      margin-top: 15px;

      padding: 12px;

      background: #0b0d12;

      border:
        1px solid #252936;

      border-radius: 10px;

      color: #aeb6c7;

      font-size: 13px;

    }


    .result {

      margin-top: 15px;

      padding: 15px;

      background: #0b0d12;

      border:
        1px solid #252936;

      border-radius: 12px;

      white-space: pre-wrap;

      word-break: break-word;

      font-size: 13px;

      color: #d5dbea;

      min-height: 150px;

    }


    .empty {

      min-height: 400px;

      display: flex;

      justify-content: center;

      align-items: center;

      text-align: center;

      color: #737c8f;

      border:
        1px dashed #343947;

      border-radius: 14px;

      padding: 30px;

    }


    .note {

      margin-top: 12px;

      color: #777f91;

      font-size: 12px;

      line-height: 1.5;

    }


    @media (max-width: 800px) {

      main {

        grid-template-columns:
          1fr;

      }

      .row {

        grid-template-columns:
          1fr;

      }

    }

  </style>

</head>



<body>


<header>

  <div class="logo">

    ✦ Mi Generador IA

  </div>

  <div class="version">

    V2 · API

  </div>

</header>



<main>


<!-- =====================================================
     PANEL IZQUIERDO
====================================================== -->

<section class="card">

  <h2>
    Crear imagen
  </h2>


  <label for="prompt">

    Prompt

  </label>


  <textarea
    id="prompt"
    placeholder="Describe la imagen que quieres crear..."
  ></textarea>



  <label for="negative">

    Prompt negativo

  </label>


  <textarea
    id="negative"
    style="min-height:80px"
    placeholder="borroso, baja calidad, deformado..."
  ></textarea>



  <div class="row">


    <div>

      <label for="ratio">

        Formato

      </label>


      <select id="ratio">

        <option value="1:1">
          1:1
        </option>

        <option value="9:16">
          9:16
        </option>

        <option value="16:9">
          16:9
        </option>

      </select>

    </div>



    <div>

      <label for="style">

        Estilo

      </label>


      <select id="style">

        <option value="Fotorealista">
          Fotorealista
        </option>

        <option value="Cinematográfico">
          Cinematográfico
        </option>

        <option value="3D">
          3D
        </option>

        <option value="Anime">
          Anime
        </option>

        <option value="Ilustración">
          Ilustración
        </option>

      </select>

    </div>


  </div>



  <!-- BOTÓN PRINCIPAL -->

  <button
    id="generateButton"
    type="button"
  >

    🚀 Probar API

  </button>



  <button
    id="saveButton"
    class="secondary"
    type="button"
  >

    💾 Guardar prompt

  </button>



  <div
    id="status"
    class="status"
  >

    Estado: listo.

  </div>



  <div
    id="result"
    class="result"
  >

    Aquí aparecerá la respuesta de Supabase.

  </div>



  <div class="note">

    Esta V2 prueba la comunicación con tu
    Edge Function. Todavía no genera imágenes.

  </div>


</section>



<!-- =====================================================
     PANEL DERECHO
====================================================== -->

<section class="card">

  <h2>

    Generador

  </h2>


  <div
    id="gallery"
    class="empty"
  >

    🖼️

    <br><br>

    Cuando conectemos el modelo de imágenes,
    las imágenes aparecerán aquí.

  </div>

</section>


</main>



<script>


/*
===========================================================
URL DE TU API
===========================================================
*/

const API_URL =
"https://vogvuahtbrwuebfvehzf.supabase.co/functions/v1/dynamic-task";



/*
===========================================================
ELEMENTOS
===========================================================
*/

const promptInput =
document.getElementById(
  "prompt"
);

const negativeInput =
document.getElementById(
  "negative"
);

const ratioInput =
document.getElementById(
  "ratio"
);

const styleInput =
document.getElementById(
  "style"
);

const generateButton =
document.getElementById(
  "generateButton"
);

const saveButton =
document.getElementById(
  "saveButton"
);

const statusBox =
document.getElementById(
  "status"
);

const resultBox =
document.getElementById(
  "result"
);

const gallery =
document.getElementById(
  "gallery"
);



/*
===========================================================
FUNCIÓN DE ESTADO
===========================================================
*/

function status(message) {

  statusBox.textContent =
    "Estado: " + message;

}



/*
===========================================================
BOTÓN GENERAR
===========================================================
*/

generateButton.addEventListener(
  "click",
  async function () {


    console.log(
      "BOTÓN PRESIONADO"
    );


    const prompt =
      promptInput.value.trim();


    /*
    -----------------------------------------
    COMPROBAR PROMPT
    -----------------------------------------
    */

    if (!prompt) {

      status(
        "Escribe un prompt primero."
      );

      promptInput.focus();

      return;

    }



    /*
    -----------------------------------------
    BLOQUEAR BOTÓN
    -----------------------------------------
    */

    generateButton.disabled =
      true;

    generateButton.textContent =
      "⏳ Conectando...";


    status(
      "Enviando solicitud a Supabase..."
    );


    resultBox.textContent =
      "Conectando con:\n\n" +
      API_URL;



    /*
    -----------------------------------------
    DATOS
    -----------------------------------------
    */

    const dataToSend = {

      prompt:
        prompt,

      negative_prompt:
        negativeInput.value.trim(),

      aspect_ratio:
        ratioInput.value,

      style:
        styleInput.value

    };


    console.log(
      "DATOS ENVIADOS:",
      dataToSend
    );



    try {


      /*
      =====================================================
      FETCH POST
      =====================================================
      */

      const response =
        await fetch(
          API_URL,
          {

            method: "POST",

            mode: "cors",

            cache: "no-cache",

            headers: {

              "Content-Type":
                "application/json"

            },

            body:
              JSON.stringify(
                dataToSend
              )

          }
        );



      console.log(
        "STATUS HTTP:",
        response.status
      );



      /*
      -----------------------------------------
      LEER RESPUESTA
      -----------------------------------------
      */

      const text =
        await response.text();


      console.log(
        "RESPUESTA:",
        text
      );



      /*
      -----------------------------------------
      MOSTRAR RESPUESTA
      -----------------------------------------
      */

      resultBox.textContent =
        "HTTP " +
        response.status +
        "\n\n" +
        text;



      /*
      -----------------------------------------
      RESPUESTA CORRECTA
      -----------------------------------------
      */

      if (
        response.ok
      ) {

        status(
          "✅ ¡La página se conectó con tu API!"
        );


        gallery.className =
          "empty";


        gallery.innerHTML =
          "✅ API funcionando<br><br>" +
          "Solicitud recibida correctamente.";

      }


      /*
      -----------------------------------------
      ERROR HTTP
      -----------------------------------------
      */

      else {

        status(
          "⚠️ La API respondió con HTTP " +
          response.status
        );

      }


    }


    /*
    =====================================================
    ERROR DE CONEXIÓN
    =====================================================
    */

    catch (error) {


      console.error(
        "ERROR FETCH:",
        error
      );


      resultBox.textContent =
        "ERROR\n\n" +
        error.message +
        "\n\n" +
        "URL utilizada:\n" +
        API_URL;


      status(
        "❌ Error de conexión"
      );


    }


    /*
    -----------------------------------------
    ACTIVAR BOTÓN
    -----------------------------------------
    */

    generateButton.disabled =
      false;

    generateButton.textContent =
      "🚀 Probar API";


  }
);



/*
===========================================================
GUARDAR PROMPT
===========================================================
*/

saveButton.addEventListener(
  "click",
  function () {


    const data = {

      prompt:
        promptInput.value,

      negative_prompt:
        negativeInput.value,

      aspect_ratio:
        ratioInput.value,

      style:
        styleInput.value

    };


    localStorage.setItem(
      "mi_generador_prompt",
      JSON.stringify(data)
    );


    status(
      "Prompt guardado."
    );

  }
);



/*
===========================================================
CARGAR PROMPT
===========================================================
*/

try {


  const saved =
    localStorage.getItem(
      "mi_generador_prompt"
    );


  if (saved) {

    const data =
      JSON.parse(saved);


    promptInput.value =
      data.prompt || "";


    negativeInput.value =
      data.negative_prompt || "";


    ratioInput.value =
      data.aspect_ratio || "1:1";


    styleInput.value =
      data.style ||
      "Fotorealista";

  }


}

catch (error) {

  console.log(
    "No se pudo cargar el prompt."
  );

}


</script>


</body>

</html>
